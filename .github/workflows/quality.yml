name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, lint, intake contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://apsiwkvpcmhpjxzhqsya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mgOlWQsuwK13_5iR_Pwvdg_p3-Kmy5L
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      PALCO_ADMIN_API_TOKEN: ci-admin-token-placeholder
      ANTHROPIC_API_KEY: ci-anthropic-placeholder

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit current dependencies
        run: |
          npm audit --json > npm-audit-before.json || true
          node scripts/summarize-npm-audit.mjs npm-audit-before.json

      - name: Prepare compatible dependency fixes
        run: |
          npm install next@16.3.0 eslint-config-next@16.3.0 --save-exact --package-lock-only
          npm audit fix --package-lock-only
          npm ci

      - name: Audit fixed dependencies
        run: |
          npm audit --json > npm-audit-after.json || true
          node scripts/summarize-npm-audit.mjs npm-audit-after.json

      - name: Validate intake contract
        run: npm run check:intake

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit compatible dependency fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "PALCO-113 — Atualiza dependências sem vulnerabilidades"
          git push origin HEAD:${{ github.head_ref }}
