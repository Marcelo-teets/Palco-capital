name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, lint, intake contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://apsiwkvpcmhpjxzhqsya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mgOlWQsuwK13_5iR_Pwvdg_p3-Kmy5L
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      PALCO_ADMIN_API_TOKEN: ci-admin-token-placeholder
      ANTHROPIC_API_KEY: ci-anthropic-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit current dependencies
        run: |
          npm audit --json > npm-audit-before.json || true
          node scripts/summarize-npm-audit.mjs npm-audit-before.json

      - name: Prepare compatible dependency fixes
        run: |
          npm install next@16.3.0 --save-exact --package-lock-only
          npm audit fix --package-lock-only
          npm ci

      - name: Audit fixed dependencies
        run: |
          npm audit --json > npm-audit-after.json || true
          node scripts/summarize-npm-audit.mjs npm-audit-after.json

      - name: Validate intake contract
        run: npm run check:intake

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dependency fix
        uses: actions/upload-artifact@v4
        with:
          name: palco-dependency-fix
          path: |
            package.json
            package-lock.json
            npm-audit-before.json
            npm-audit-after.json
          if-no-files-found: error
          retention-days: 1
